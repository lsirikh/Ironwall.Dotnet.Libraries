    - code [ref=f10e20003]: s.DeviceType == device.DeviceType
    - text: ")가 항상 실패하고 ID 폴백 + 경고 로그가 남는다(서버는 그 타입을 보내지 않는다). 변형 컬럼은 이 경로를 전혀 지나지 않으므로 기존 장비 연동이 그대로다. 확장 — 같은 틀로 다른 계열도 늘릴 수 있다(예: 스마트 센서 벽부형/폴형, 스피커 혼형/박스형). 팔레트 셀만 추가하면 되고 서버 계약은 계속 불변이다."
  - heading "8-D. 드래그 배치 — 실제 상태 전이" [level=3] [ref=f10e20004]
