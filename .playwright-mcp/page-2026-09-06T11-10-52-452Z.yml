    - text: )의 상태 기계를 그대로 승계한다. 진입 시 조준·라인드로잉·측정을 정리하고(
    - code [ref=f10e20007]: MapViewModel.cs:743-745
    - text: ), ESC 훅을 걸고, 완료는 단발이다. 다른 점은 진입 트리거가 [추가] 버튼이 아니라 드래그 시작이고, 좌표가 클릭이 아니라 드롭 지점이라는 것뿐이다.
