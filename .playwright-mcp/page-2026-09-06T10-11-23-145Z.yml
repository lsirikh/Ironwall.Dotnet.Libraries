  - paragraph [ref=f4e16108]: "요약: 전 필드 중 무변경 다수, 재정의 7(크기·회전·탐지방향·건물종류 + 채우기·테두리·선두께), 결정 2(건물용도 G-12 · 층수 G-13). 색 3필드는 §7-A 에서 직접 만져 볼 수 있다. 속성 패널 레이아웃 변경은 필요 없고, 틴트 세기 슬라이더 1개만 추가하면 된다(선택)."
  - heading "6-E. 전수 매핑 — 안 쓰이는 필드 0 (DB 컬럼 기준)" [level=3] [ref=f4e16109]
  - paragraph [ref=f4e16110]:
    - text: 스코프 주의 — 아래 "3D 역할" 은 등급 A(3D 하우징) 컨트롤의 자기 템플릿 안에서만 성립한다.
    - code [ref=f4e16111]: MarkerFill
    - text: ·
    - code [ref=f4e16112]: MarkerStroke
    - text: ·
    - code [ref=f4e16113]: MarkerStrokeThickness
    - text: 는
    - code [ref=f4e16114]: GMapMarkerBaseControl.cs:105/120/135
    - text: 에 베이스 1곳으로 선언돼 파생 8종이 공유하지만, 소비 지점은 이미 템플릿마다 다르다 — 기하=도형 Fill(8) · PIDS=아이콘 뒤 원판 Border(6) · 인프라=건물 면(5) · 라인/그룹=Polyline 선 색 · 핀=Path · 군대부호=APP-6D 소속색(Fill 12·Stroke 67). 따라서 이번 변경은 베이스 DP 의 의미를 바꾸는 것이 아니라, 3D 하우징 템플릿이라는 소비 지점을 하나 추가하는 것이다. 나머지 7개 템플릿 파일은 무변경이고 군대부호는 3D 제외라 소속색 규약이 그대로다.
  - paragraph [ref=f4e16115]:
    - text: "사용자 지시(2026-09-04): \"어떻게든 안 쓰이는 것 없이 쓰이도록\"."
