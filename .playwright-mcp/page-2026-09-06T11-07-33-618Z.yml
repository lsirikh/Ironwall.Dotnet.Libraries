  - heading "7. 속성 편집 → 3D 반영 (라이브 — 슬라이더를 직접 움직여 볼 것)" [level=2] [ref=f6e484]
  - paragraph [ref=f6e485]: 마커 에디터의 실제 필드를 그대로 놓고, 값을 바꿨을 때 3D 가 어떻게 반응하는지 즉시 보여준다. 배지는 §6-D 판정과 같다 — 무변경 현행 그대로 · 재정의 소비 지점이 바뀜 · 결정 미정. 색 3필드는 사용자 지시(2026-09-04)로 살렸다 — 채우기는 하우징 본체 재질 틴트, 테두리·선두께는 접지 링으로 간다(상태색과 분리). 사용자 지시대로 PIDS 점 심볼과 PIDS 그룹(철책) 두 계열을 먼저 만들었다.
  - heading "7-A. PIDS 점 심볼 — 하우징 · FOV · 라벨" [level=3] [ref=f6e486]
  - heading "7-B. PIDS 그룹(철책) — 정점 재투영 + 2.5D 리본" [level=3] [ref=f6e487]
  - paragraph [ref=f6e488]:
    - text: 그룹은 점 심볼과 회전 경로가 다르다.
    - code [ref=f6e489]: AppliesMapRotation=false
    - text: (
    - code [ref=f6e490]: GMapMarkerPidsGroupControl.cs:142
    - text: ) 라 표시각에서 −θ 를 빼지 않고, 정점을
    - code [ref=f6e491]: FromLatLngToLocal
    - text: 로 매번 재투영한다 — 리본은 지형에 붙어 돌고, 하우징처럼 자기 축으로 도는 게 아니다. 아래에서 지도 회전을 돌려 두 거동을 비교할 수 있다.
  - heading "7-C. 기반시설 — 층수 · 지하층 · 면적 · 용도를 형상으로" [level=3] [ref=f6e492]
  - paragraph [ref=f6e493]: 인프라 4필드는 지금 텍스트로만 표시되거나(층수·지하층) 아예 안 쓰인다(면적). 3D 에서는 각각 창문 띠 개수 · 지하 파선 윤곽 · 접지 footprint 크기 · 지붕 액센트 색으로 형상에 태운다.
