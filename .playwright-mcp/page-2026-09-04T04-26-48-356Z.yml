  - paragraph [ref=f2e16101]: 마커 에디터의 실제 필드를 그대로 놓고, 값을 바꿨을 때 3D 가 어떻게 반응하는지 즉시 보여준다. 배지는 §6-D 판정과 같다 — 무변경 현행 그대로 · 재정의 소비 지점이 바뀜 · 의미상실 3D 에 칠할 대상이 없음(만져도 미리보기가 안 바뀐다) · 결정 미정. 사용자 지시대로 PIDS 점 심볼과 PIDS 그룹(철책) 두 계열을 먼저 만들었다.
